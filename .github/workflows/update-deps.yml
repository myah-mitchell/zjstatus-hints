---
name: Update dependencies
on:
  schedule:
    # 04:00 UTC, an hour before the nightly build, so a merged update is
    # already in main by the time the nightly runs.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  # Branch is reused, so a rerun updates the open PR instead of opening another.
  BRANCH: deps/auto-update

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    steps:
      # A PR opened with the default GITHUB_TOKEN does not start any workflows,
      # which would leave required checks pending forever and auto-merge stuck.
      # A PAT is what makes the hands-off flow work. See docs/AUTOMATION.md.
      - name: Check for the automation token
        run: |
          if [ -z "${{ secrets.AUTOMATION_TOKEN }}" ]; then
            echo "::error::AUTOMATION_TOKEN is not set. Without it the pull" \
                 "request opens but CI never runs on it, so auto-merge can" \
                 "never complete. See docs/AUTOMATION.md."
            exit 1
          fi

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          ref: main
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.96.0"
          target: wasm32-wasip1

      - name: Record current versions
        id: before
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, ".github/scripts")
          from check_deps import direct_dependencies, locked_versions
          deps = direct_dependencies(open("Cargo.toml").read())
          locked = locked_versions(open("Cargo.lock").read())
          print("versions=" + json.dumps({d: locked[d] for d in deps if d in locked}))
          EOF

      # Moves each dependency to the newest release its Cargo.toml requirement
      # allows. For 0.x crates that is patch-only, which is the policy for the
      # Zellij crates and a safe default for the rest.
      - name: Update dependencies
        run: cargo update

      - name: Summarise what changed
        id: deps
        run: python3 .github/scripts/check_deps.py '${{ steps.before.outputs.versions }}'

      - name: Bump patch version
        if: steps.deps.outputs.changed == 'true'
        id: bump
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import re
          text = open("Cargo.toml").read()
          match = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', text, re.M)
          major, minor, patch = (int(g) for g in match.groups())
          new = f"{major}.{minor}.{patch + 1}"
          text = text[: match.start()] + f'version = "{new}"' + text[match.end() :]
          open("Cargo.toml", "w").write(text)
          print(f"version={new}")
          EOF
          # Keep Cargo.lock's own entry in step with Cargo.toml.
          cargo update --workspace --offline || cargo update --workspace

      - name: Ensure OpenSSL headers
        if: steps.deps.outputs.changed == 'true'
        run: |
          if ! pkg-config --exists openssl; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          fi

      # Proven green before the PR is opened, so a red PR means CI found
      # something this job did not.
      - name: Test
        if: steps.deps.outputs.changed == 'true'
        run: cargo test --all-features

      - name: Build
        if: steps.deps.outputs.changed == 'true'
        run: cargo build --release --target=wasm32-wasip1

      - name: Open or update the pull request
        if: steps.deps.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7 # TODO: pin to a SHA
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          branch: ${{ env.BRANCH }}
          delete-branch: true
          base: main
          commit-message: |
            chore(deps): update dependencies and bump to ${{ steps.bump.outputs.version }}

            Opened automatically by .github/workflows/update-deps.yml.
            Tests and a release build passed before this was raised.
          title: "chore(deps): update dependencies (v${{ steps.bump.outputs.version }})"
          labels: |
            dependencies
            ${{ steps.deps.outputs.zellij_minor_available == 'true' && 'needs-zellij-upgrade' || '' }}
          body: |
            Automated dependency update. Merging publishes
            **v${{ steps.bump.outputs.version }}** and moves `latest`.

            ${{ steps.deps.outputs.summary }}

            <details>
            <summary>What ran before this was opened</summary>

            - `cargo update` — semver-compatible updates only
            - `cargo test --all-features`
            - `cargo build --release --target=wasm32-wasip1`

            </details>

            Approving is enough; CI merges it once green.

      # Held back when a Zellij minor is out, because approving that one means
      # upgrading Zellij first and should not happen while half-awake.
      - name: Enable auto-merge
        if: |
          steps.deps.outputs.changed == 'true' &&
          steps.deps.outputs.zellij_minor_available != 'true' &&
          steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}" \
            || echo "::warning::Could not enable auto-merge. Check that auto-merge" \
                    "is allowed on the repository and that main has a branch" \
                    "protection rule. See docs/AUTOMATION.md."

      - name: Note when auto-merge is withheld
        if: steps.deps.outputs.zellij_minor_available == 'true'
        run: |
          echo "::warning::A Zellij crate has a new minor release. Auto-merge" \
               "was not enabled — upgrade Zellij before taking this update."
