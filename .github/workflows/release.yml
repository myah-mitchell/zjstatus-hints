---
name: Release
on:
  # Manual route: push a tag yourself.
  push:
    tags:
      - "v*.*.*"
    # Automatic route: a merge to main whose Cargo.toml version has no tag yet.
    # Dependency PRs bump the patch version as part of the PR, so merging one
    # lands a new version here and this publishes it.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # git-cliff needs history to build a changelog
          fetch-tags: true

      # Works out what is being released and whether there is anything to do.
      #
      # On a tag push the tag is the answer. On a push to main the version comes
      # from Cargo.toml, and the run is skipped when that version is already
      # tagged — most merges to main are not releases.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "Releasing tag ${tag}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::${tag} is already released; nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cargo.toml is at ${version}, which has no tag yet."
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.version.outputs.proceed == 'true'
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.96.0"
          target: wasm32-wasip1

      # Releases are rare and must be trustworthy, so they are built and tested
      # from scratch rather than from a cache.
      - name: Ensure OpenSSL headers
        if: steps.version.outputs.proceed == 'true'
        run: |
          if ! pkg-config --exists openssl; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          fi

      - name: Test
        if: steps.version.outputs.proceed == 'true'
        run: cargo test --all-features

      - name: Build release binary
        if: steps.version.outputs.proceed == 'true'
        run: cargo build --release --target=wasm32-wasip1

      # Tag before generating notes, so git-cliff sees the release it is
      # describing as the latest one.
      - name: Create tag
        if: steps.version.outputs.proceed == 'true' && steps.version.outputs.create_tag == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Generate a changelog
        if: steps.version.outputs.proceed == 'true'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v3
        id: git-cliff
        with:
          config: cliff.toml
          # The action defaults to git-cliff 2.10.1, whose `--latest` walks only
          # the first-parent chain. Merge-commit merges (which this repo uses,
          # to keep stacked PRs intact) put each PR's real feat/fix commits on a
          # second parent, so 2.10.1 attributed them to the wrong release and a
          # release's notes came out as just the version-bump commit. Fixed in
          # later git-cliff; pin a version that reads the full history.
          version: "2.13.1"
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Create release
        if: steps.version.outputs.proceed == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.git-cliff.outputs.content }}
          # Published, not draft: this is the release `/releases/latest/`
          # resolves to, and approving a PR is meant to be the last manual step.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./target/wasm32-wasip1/release/zjstatus-hints.wasm

      # `latest` tracks this release, which is not always built for the
      # Zellij a given user runs - zellij-tile only moves past a minor
      # deliberately (see the zellij-upgrade job in update-deps.yml). This
      # gives every Zellij line its own stable pointer: `make zellij
      # VERSION=0.44` (see the Makefile) always resolves to the newest
      # release built for that line, however many versions of
      # zjstatus-hints itself have shipped since.
      - name: Determine the Zellij compatibility line
        if: steps.version.outputs.proceed == 'true'
        id: zellij
        run: |
          set -euo pipefail
          req="$(grep -m1 '^zellij-tile = ' Cargo.toml | cut -d'"' -f2)"
          echo "line=$(echo "$req" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Move the zellij-<line> compatibility tag
        if: steps.version.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "zellij-${{ steps.zellij.outputs.line }}"
          git push -f origin "zellij-${{ steps.zellij.outputs.line }}"

      # A release, not a bare tag, because `releases/download/<tag>/…` needs
      # an uploaded asset to serve from - a tag alone has nowhere for
      # `make zellij` to fetch. Moved rather than added to, same as
      # `nightly`, so it always names the current build for this line.
      - name: Publish the zellij-<line> compatibility release
        if: steps.version.outputs.proceed == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "zellij-${{ steps.zellij.outputs.line }}"
          name: "Zellij ${{ steps.zellij.outputs.line }}.x"
          body: |
            Always the newest zjstatus-hints release built against Zellij
            ${{ steps.zellij.outputs.line }}.x. Currently
            **${{ steps.version.outputs.tag }}**.

            Not a distinct release - an alias, moved here each time a new
            ${{ steps.zellij.outputs.line }}.x-compatible version ships. See
            [docs/AUTOMATION.md](https://github.com/${{ github.repository }}/blob/main/docs/AUTOMATION.md).
          # Not `latest`, deliberately - this is a compatibility pointer, and
          # `make_latest: true` here would fight the real latest release for
          # what `/releases/latest/` resolves to.
          draft: false
          prerelease: false
          make_latest: false
          files: |
            ./target/wasm32-wasip1/release/zjstatus-hints.wasm
